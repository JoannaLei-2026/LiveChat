<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat</title>
  <meta name="description" content="基於 Python FastAPI + WebSockets 的 Gemini 即時角色對話系統。">
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Background Glow FX -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Top Navigation / Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <i class="fa-brands fa-python logo-icon"></i>
          <span class="logo-text">Live <span>Chat</span></span>
        </div>
        <div class="model-badge" id="modelBadge">
          <i class="fa-solid fa-brain"></i> Gemini 3.1 Flash Live
        </div>
        <div class="status-badge" id="statusBadge">
          <span class="status-dot offline" id="statusDot"></span>
          <span id="statusText">連線中...</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Voice Gender Toggle Button (Male Puck vs Female Aoede) -->
        <button class="btn btn-secondary" id="btnVoiceGender" title="切換 AI 語音聲音性別 (男聲 / 女聲)">
          <i class="fa-solid fa-mars-stroke" id="voiceGenderIcon"></i>
          <span id="voiceGenderText">AI 聲音：男聲</span>
        </button>

        <!-- Voice Toggle Button (Full Voice vs Mute Transcript View) -->
        <button class="btn btn-voice-toggle active" id="btnVoiceToggle" title="切換語音播報與靜音字幕模式">
          <i class="fa-solid fa-volume-high" id="voiceToggleIcon"></i>
          <span id="voiceToggleText">全程語音 ON</span>
        </button>

        <!-- Mic Toggle Button -->
        <button class="btn btn-mic" id="btnMicToggle" title="開啟/關閉麥克風即時語音對話">
          <i class="fa-solid fa-microphone-slash" id="micIcon"></i>
          <span id="micText">開啟麥克風</span>
        </button>

        <!-- Interrupt AI Button -->
        <button class="btn btn-secondary btn-interrupt" id="btnInterrupt" title="中途打斷 AI 發言 (停止語音播放)" style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4);">
          <i class="fa-solid fa-hand"></i>
          <span>打斷發言</span>
        </button>

        <button class="btn btn-secondary" id="btnChangePersona" title="變更對話角色設定">
          <i class="fa-solid fa-sliders"></i>
          <span>變更角色 Prompt</span>
        </button>
      </div>
    </header>

    <!-- Audio Visualizer Wave Bar -->
    <div class="voice-wave-bar" id="voiceWaveBar">
      <div class="wave-indicator" id="waveIndicator">
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
      </div>
      <span class="wave-status" id="waveStatusText">全程語音模式已啟用｜可使用麥克風或輸入文字對話</span>
    </div>

    <!-- Active Persona Info Bar -->
    <div class="persona-bar">
      <div class="persona-label">
        <i class="fa-solid fa-user-gear"></i>
        <span>當前對話對象設定：</span>
      </div>
      <div class="persona-content" id="currentPersonaText">尚未設定對象 (點擊設定)</div>
    </div>

    <!-- Chat Messages Window -->
    <main class="chat-window" id="chatWindow">
      <!-- Messages rendered dynamically here -->
    </main>

    <!-- Pure Voice Interaction Controller Bar -->
    <footer class="voice-controller-area">
      <div class="voice-main-controls">
        <button class="btn btn-mic-main" id="btnMicMain" title="點擊開啟/暫停麥克風對話">
          <div class="mic-pulse-ring" id="micPulseRing"></div>
          <i class="fa-solid fa-microphone-slash" id="mainMicIcon"></i>
          <span id="mainMicText">點擊開啟麥克風，開始全程語音對話</span>
        </button>
      </div>
      <div class="voice-footer-info">
        <span id="voiceStatusHint">🎙️ 純語音互動模式：無需手動打字，對著麥克風說話即可；關閉語音時可實時觀看對話紀錄與字幕。</span>
        <span class="version-tag">Python FastAPI Engine</span>
      </div>
    </footer>
  </div>

  <!-- Persona Setup Modal -->
  <div class="modal-overlay" id="personaModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <h2>設定聊天對象 (System Persona Prompt)</h2>
        </div>
        <p class="modal-subtitle">選擇語音服務並設定聊天對象。GPT-Live 會在點擊麥克風時開始計費會話。</p>
      </div>

      <!-- Preset Quick Selection Cards -->
      <div class="presets-section">
        <span class="presets-title"><i class="fa-solid fa-fire-flame-curved"></i> 常用預設角色快捷選擇：</span>
        <div class="preset-grid">
          <button class="preset-card" data-prompt="你是一位幽默熱情且經驗豐富的 Senior Python & AI 架構師，語氣隨和但解說非常精確，喜歡用簡單生動的比喻解答問題。">
            <span class="preset-emoji">🐍</span>
            <span class="preset-name">Python AI 大師</span>
          </button>
          <button class="preset-card" data-prompt="你是一位來自 18 世紀加勒比海的資深海盜船長，名字叫黑鬍子船長，說話帶有濃厚的海盜口吻（常見語助詞如「Ahoy!」、「Yo-ho-ho!」），豪爽熱情且熱愛冒險。">
            <span class="preset-emoji">🏴‍☠️</span>
            <span class="preset-name">加勒比海盜船長</span>
          </button>
          <button class="preset-card" data-prompt="你是一位溫暖、極具同理心且耐心聽你傾訴的心理諮商師，善於導引思考並提供正向情緒價值。">
            <span class="preset-emoji">🧘</span>
            <span class="preset-name">溫暖心靈導師</span>
          </button>
          <button class="preset-card" data-prompt="你是一隻傲嬌但很聰明的貓娘 AI 助理，說話句尾偶爾會帶「喵～」，表面上口嫌體正直，實際上會非常認真仔細地幫忙解決所有問題。">
            <span class="preset-emoji">🐱</span>
            <span class="preset-name">傲嬌貓娘助理</span>
          </button>
        </div>
      </div>

      <div class="custom-prompt-wrapper">
        <label for="providerSelect">語音服務</label>
        <select id="providerSelect">
          <option value="gemini">Gemini Live</option>
          <option value="openai">OpenAI GPT-Live</option>
        </select>
      </div>

      <!-- Custom Prompt Textarea -->
      <div class="custom-prompt-wrapper">
        <label for="customPersonaInput"><i class="fa-solid fa-pen-to-square"></i> 自訂對話角色提示詞 (System Instruction):</label>
        <textarea 
          id="customPersonaInput" 
          rows="4" 
          placeholder="例如：你是一位精通日文與中文的旅遊專家，隨時準備為我規劃完美的京都行程..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCancelModal" style="display:none;">取消</button>
        <button type="button" class="btn btn-primary btn-large" id="btnSavePersona">
          <i class="fa-solid fa-check"></i>
          <span>確認角色並開始對話</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Application JS -->
  <script src="/static/openai-live.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
